name: Connected website

on:
  pull_request:
    paths:
      [
        'apps/website/**',
        'services/crm-api/**',
        'tests/api/website-*.mjs',
        'compose.test.yaml',
        '.github/workflows/website-connected.yml',
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-api-and-next:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
      API_TEST_FILES: tests/api/website-next.test.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/website/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.89'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/crm-api -> target
      - run: npm ci
      - run: npm ci --prefix apps/website
      - run: npm run build --prefix apps/website
      - run: npx playwright install --with-deps chromium
      # The existing runner uses --offline; fetch the locked Rust dependencies first.
      - run: cargo fetch --locked --manifest-path services/crm-api/Cargo.toml
      - run: npm run test:api
