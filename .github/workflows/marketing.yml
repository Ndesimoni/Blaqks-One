name: Brokerage website

on:
  pull_request:
    paths: ['apps/marketing/**', '.github/workflows/marketing.yml']
  push:
    branches: [main]
    paths: ['apps/marketing/**', '.github/workflows/marketing.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nextjs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/marketing/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
