<!doctype html>
<html lang="en" dir="ltr" data-theme="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#142322" />
    <meta name="description" content="Keys with Simoni Real Estate CRM" />
    <title>Keys with Simoni · Real Estate CRM</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <script>
      // Start in the theme shared with the website (b1-theme cookie), else the one saved here,
      // so the first screen never flashes the other colour (useWorkspacePreferences).
      try {
        const shared = document.cookie.match(/(?:^|;\s*)b1-theme=(light|dark)(?:;|$)/);
        const saved = JSON.parse(localStorage.getItem('kws-crm-preferences'))?.theme;
        if ((shared ? shared[1] : saved) === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.style.colorScheme = 'light';
        }
      } catch {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
