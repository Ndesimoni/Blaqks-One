services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kws_crm_test
      POSTGRES_USER: kws_crm_test
      POSTGRES_PASSWORD: ${CRM_TEST_DB_PASSWORD:?Test runner must provide a private password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - '127.0.0.1::5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kws_crm_test -d kws_crm_test']
      interval: 2s
      timeout: 3s
      retries: 20
  # Private file storage for the media suites (docs/media-storage.md): S3-compatible,
  # signatures enforced, disposable like the database.
  storage:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/s3.json -master.volumeSizeLimitMB=64 -volume.max=8 -ip=127.0.0.1 -ip.bind=0.0.0.0
    ports:
      - '127.0.0.1::8333'
    tmpfs:
      - /data
    configs:
      - source: storage
        target: /etc/s3.json
    healthcheck:
      test: ['CMD-SHELL', 'wget -Y off -q -O /dev/null http://127.0.0.1:8333/healthz']
      interval: 2s
      timeout: 3s
      retries: 40

configs:
  storage:
    content: |
      {"identities":[{"name":"crm","credentials":[{"accessKey":"${CRM_MEDIA_ACCESS_KEY:?Test runner must provide a storage key}","secretKey":"${CRM_MEDIA_SECRET_KEY:?Test runner must provide a storage secret}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
