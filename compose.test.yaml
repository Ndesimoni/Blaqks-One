services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kws_crm_test
      POSTGRES_USER: kws_crm_test
      POSTGRES_PASSWORD: ${CRM_TEST_DB_PASSWORD:?Test runner must provide a private password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - '127.0.0.1::5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kws_crm_test -d kws_crm_test']
      interval: 2s
      timeout: 3s
      retries: 20
