[package]
name = "kws-crm-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
dotenvy = "0.15"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
time = { version = "0.3", features = ["parsing", "formatting"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Project-wide rules (docs/tech-stack.md, Quality): no unsafe code and no debug leftovers.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
