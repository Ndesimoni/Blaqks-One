[package]
name = "kws-calendar"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
aes-gcm = "0.10"
url = "2"
dotenvy = "0.15"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Project-wide rules (docs/tech-stack.md, Quality): no unsafe code and no debug leftovers.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
