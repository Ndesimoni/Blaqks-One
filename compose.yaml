name: keys-with-simoni

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kws_crm
      POSTGRES_USER: kws_crm
      POSTGRES_PASSWORD: ${CRM_POSTGRES_PASSWORD:?Run npm run setup:crm first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - '127.0.0.1:${CRM_POSTGRES_PORT:-55432}:5432'
    volumes:
      - crm-postgres:/var/lib/postgresql/data
      # New volumes only: marks this local database for the sample-data commands.
      - ./services/crm-api/dev/local-development.sql:/docker-entrypoint-initdb.d/10-local-development.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kws_crm -d kws_crm']
      interval: 5s
      timeout: 3s
      retries: 12
    shm_size: 128mb

  # Private file storage (docs/media-storage.md): S3-compatible, signatures enforced.
  storage:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/s3.json -master.volumeSizeLimitMB=256 -volume.max=16 -ip=127.0.0.1 -ip.bind=0.0.0.0
    ports:
      - '127.0.0.1:${CRM_MEDIA_PORT:-58333}:8333'
    volumes:
      - crm-storage:/data
    configs:
      - source: storage
        target: /etc/s3.json
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 3s
      retries: 24

configs:
  storage:
    content: |
      {"identities":[{"name":"crm","credentials":[{"accessKey":"${CRM_MEDIA_ACCESS_KEY:?Run npm run setup:crm or add the storage keys to .env}","secretKey":"${CRM_MEDIA_SECRET_KEY:?Run npm run setup:crm or add the storage keys to .env}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}

volumes:
  crm-postgres:
  crm-storage:
